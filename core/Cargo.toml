[package]
name    = "sipress-core"
version = "0.7.5"
edition = "2021"

[dependencies]
tokio        = { workspace = true }
anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
rand         = { workspace = true }
tracing      = { workspace = true }
hdrhistogram = { workspace = true }
md-5         = { workspace = true }
zip          = { workspace = true }
socket2      = "0.6"
# 雲端 TTS：TLS 用 ring（aws-lc 在 Windows 需要 cmake / NASM 才能編譯）
reqwest      = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64       = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Networking_WinSock"] }
